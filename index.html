function nextLessonStep() { lessonSt.stepIdx++; renderLessonStep(); }

function startLessonQuiz() {
  lessonSt.phase      = 'quiz';
  lessonSt.quizIdx    = 0;
  lessonSt.quizScores = [];

  // ダミー問題：他レッスンの quizItems からランダムに3問混入
  const lesson = LESSONS.find(l => l.id === lessonSt.lessonId);
  const ownKeys = new Set(lesson.quizItems.map(x => x.hand + x.dealer + x.cat));
  const dummyPool = LESSONS.filter(l => l.id !== lessonSt.lessonId)
    .flatMap(l => l.quizItems)
    .filter(x => !ownKeys.has(x.hand + x.dealer + x.cat));
  const dummies = dummyPool.sort(() => Math.random() - 0.5).slice(0, 3).map(x => ({ ...x, isDummy: true }));

  // 元のクイズアイテムをシャッフルしてダミーを散りばめる
  const base = [...lesson.quizItems].sort(() => Math.random() - 0.5);
  const mixed = [];
  const insertAt = new Set([Math.floor(base.length / 4), Math.floor(base.length / 2), Math.floor(base.length * 3 / 4)]);
  let di = 0;
  base.forEach((item, i) => {
    mixed.push(item);
    if (insertAt.has(i) && di < dummies.length) mixed.push(dummies[di++]);
  });
  while (di < dummies.length) mixed.push(dummies[di++]);

  lessonSt.mixedItems = mixed;
  renderLessonQuiz();
}

// ── Render: Lesson Quiz ───────────────────────────────────────
function renderLessonQuiz() {
  const lesson = LESSONS.find(l => l.id === lessonSt.lessonId);
  const items  = lessonSt.mixedItems || lesson.quizItems;
  const item   = items[lessonSt.quizIdx];
  const q      = item ? ALL_QUESTIONS.find(q => q.playerHand===item.hand && q.dealerCard===item.dealer && q.category===item.cat) : null;
  if (!q) { completeLessonQuiz(); return; }

  state.screen = 'lesson-quiz';
  const total  = items.length;
  const pct    = Math.round(lessonSt.quizIdx / total * 100);
  const pcards = handToCards(q.playerHand, q.category);

  $app().innerHTML = `
    <div class="screen">
      <div class="topbar">
        <button class="btn btn-ghost btn-sm" onclick="renderLearningMode()">← 終了</button>
        <span style="font-size:13px;font-weight:700;color:var(--muted)">練習 ${lessonSt.quizIdx+1}/${total}</span>
        <span class="chip ${chipClass(q.category)}">${q.category}</span>
      </div>
      <div class="prog-wrap"><div class="prog-fill" style="width:${pct}%;background:${lesson.color}"></div></div>
      <div style="text-align:center;font-size:13px;font-weight:700;margin-bottom:18px;color:${item.isDummy?'#94a3b8':lesson.color}">
        ${item.isDummy
          ? `<span style="background:rgba(148,163,184,.15);border:1px solid rgba(148,163,184,.3);border-radius:100px;padding:2px 10px;font-size:11px;color:#94a3b8;margin-bottom:4px;display:inline-block">🎲 ランダム問題</span><br>知識の確認`
          : `${lesson.icon} ${lesson.title}`}
      </div>
      <div class="q-cards">
        <div>
          <div class="card-lbl">ディーラーのアップカード</div>
          ${cardHTML(q.dealerCard, false)}
        </div>
        <div class="vs-txt">VS</div>
        <div>
          <div class="card-lbl">あなたの手札</div>
          <div class="player-cards">${pcards.map(v=>cardHTML(v,false)).join('')}</div>
        </div>
      </div>
      <div class="action-grid" id="actions">
        <button class="act-btn btn-hit"    id="btn-Hit"    onclick="lessonAnswer('Hit')">Hit</button>
        <button class="act-btn btn-stand"  id="btn-Stand"  onclick="lessonAnswer('Stand')">Stand</button>
        <button class="act-btn btn-double" id="btn-Double" onclick="lessonAnswer('Double')">Double</button>
        <button class="act-btn btn-split"  id="btn-Split"  onclick="lessonAnswer('Split')">Split</button>
      </div>
      <div id="feedback" style="display:none;margin-top:12px"></div>
      <div id="next-area" style="margin-top:10px;min-height:48px"></div>
      <div class="disclaimer">一般的なベーシックストラテジー練習用です。カジノルールにより最適解が変わる場合があります。</div>
    </div>`;
}

function lessonAnswer(action) {
  const lesson = LESSONS.find(l => l.id === lessonSt.lessonId);
  const items  = lessonSt.mixedItems || lesson.quizItems;
  const item   = items[lessonSt.quizIdx];
  const q      = ALL_QUESTIONS.find(q => q.playerHand===item.hand && q.dealerCard===item.dealer && q.category===item.cat);
  if (!q) return;

  const isCorrect = action === q.correctAction;
  lessonSt.quizScores.push(isCorrect);
  saveResult(q, isCorrect); // 通常の成績にも反映

  ['Hit','Stand','Double','Split'].forEach(a => {
    const btn = document.getElementById('btn-'+a);
    if (!btn) return;
    btn.disabled = true;
    if (a === q.correctAction) btn.classList.add('is-correct');
    else if (a === action && !isCorrect) btn.classList.add('is-wrong');
  });

  const fb = document.getElementById('feedback');
  fb.style.display = 'block';
  fb.innerHTML = `
    <div class="feedback ${isCorrect?'fb-ok':'fb-ng'}">
      <div class="fb-hd">${isCorrect?'✓ 正解！':'✗ 不正解'}</div>
      ${!isCorrect?`<div class="fb-ans">正解：${q.correctAction}</div>`:''}
      <div class="fb-exp">${q.explanation}</div>
    </div>
    ${miniStratRow(q.playerHand, q.dealerCard, q.category)}`;

  const isLastQ = lessonSt.quizIdx >= (lessonSt.mixedItems || lesson.quizItems).length - 1;
  document.getElementById('next-area').innerHTML = `
    <button class="btn btn-primary" onclick="${isLastQ?'completeLessonQuiz()':'nextLessonQuiz()'}">
      ${isLastQ?'結果を見る →':'次の問題 →'}
    </button>`;
}

function nextLessonQuiz() { lessonSt.quizIdx++; renderLessonQuiz(); }

// ── Lesson Complete ───────────────────────────────────────────
function completeLessonQuiz() {
  const lesson   = LESSONS.find(l => l.id === lessonSt.lessonId);
  const correct  = lessonSt.quizScores.filter(Boolean).length;
  const total    = lessonSt.quizScores.length;
  const perfect  = correct === total;
  const hasNext  = lessonSt.lessonId < LESSONS.length;

  // 完了マークをsaveStats
  const stats = loadStats();
  if (!stats.completedLessons) stats.completedLessons = [];
  if (!stats.completedLessons.includes(lessonSt.lessonId))
    stats.completedLessons.push(lessonSt.lessonId);
  saveStats(stats);

  state.screen = 'lesson-complete';
  $app().innerHTML = `
    <div class="screen">
      <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:16px;padding:20px 0">
        <div style="font-size:60px">${perfect?'🏆':'📚'}</div>
        <div style="font-size:22px;font-weight:900;color:var(--gold)">レッスン完了！</div>
        <div style="font-size:15px;font-weight:700;color:var(--muted)">${lesson.icon} ${lesson.title}</div>
        <div class="score-card" style="width:100%;margin:0">
          <div class="score-frac">${correct}<span style="font-size:28px;color:var(--muted)"> / ${total}</span></div>
          <div class="score-pct" style="font-size:20px">${Math.round(correct/total*100)}%</div>
          <div class="score-msg">${perfect?'完璧！次のレッスンへ進もう 🎉':'練習問題をもう一度チャレンジしよう！'}</div>
        </div>
        ${perfect&&hasNext?`<div style="font-size:13px;color:var(--muted)">次のレッスン：${LESSONS[lessonSt.lessonId].icon} ${LESSONS[lessonSt.lessonId].title}</div>`:''}
      </div>
      <div class="btn-stack">
        ${perfect&&hasNext?`<button class="btn btn-primary" onclick="startLesson(${lessonSt.lessonId+1})">次のレッスンへ →</button>`:''}
        ${!perfect?`<button class="btn btn-secondary" onclick="startLesson(${lessonSt.lessonId})">もう一度</button>`:''}
        <button class="btn btn-ghost" onclick="renderLearningMode()">レッスン一覧へ</button>
      </div>
      <div class="disclaimer">一般的なベーシックストラテジー練習用です。カジノルールにより最適解が変わる場合があります。</div>
    </div>`;
}

// ═══════════════════════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════════════════════

renderHome();
</script>
